name: validate

# Also callable from another catalog's CI, which validates its own checkout with this repo's
# validator and fails on a skill name both catalogs would install:
#
#   jobs:
#     validate:
#       uses: Ephasme/agent-skills/.github/workflows/validate.yml@main
#       with:
#         runs-on: '["self-hosted", "linux"]'
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner label, or array of labels
        type: string
        default: '"ubuntu-latest"'

jobs:
  validate:
    runs-on: ${{ fromJSON(inputs.runs-on || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      # This repo, for its validator; when called from another catalog, also its skill names.
      - uses: actions/checkout@v4
        with:
          repository: Ephasme/agent-skills
          path: .ephasme
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the catalog
        run: |
          also=()
          [ "$GITHUB_REPOSITORY" = Ephasme/agent-skills ] || also=(--also .ephasme)
          node .ephasme/scripts/validate.mjs --root . "${also[@]}"

      # Guards against a layout change the validator cannot see: the CLI must
      # still discover every skill from the repo root, and skip none of them.
      - name: Discovery smoke test
        run: |
          set -euo pipefail
          rm -rf .ephasme
          expected=$(find skills -name SKILL.md | wc -l)
          out=$(npx -y skills add . -l 2>&1 | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g')
          echo "$out"
          if grep -q 'Skipped' <<<"$out"; then
            echo "::error::the skills CLI skipped at least one skill"
            exit 1
          fi
          if ! grep -q "Found $expected skills" <<<"$out"; then
            echo "::error::expected $expected skills, CLI reported otherwise"
            exit 1
          fi

      # Proves the portability claim rather than asserting it: the whole catalog must
      # install for every one of these agents, none of which it is written against.
      - name: Portability install
        run: |
          set -euo pipefail
          expected=$(find skills -name SKILL.md | wc -l)
          work=$(mktemp -d)
          git -C "$work" init -q .
          out=$(cd "$work" && npx -y skills add "$GITHUB_WORKSPACE" \
                  -a codex -a cursor -a opencode -a gemini-cli -s '*' -y 2>&1 \
                | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g')
          echo "$out"
          if ! grep -q "Installed $expected skills" <<<"$out"; then
            echo "::error::not every skill installed for one of the portability targets"
            exit 1
          fi
