name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the catalog
        run: node scripts/validate.mjs

      # Guards against a layout change the validator cannot see: the CLI must
      # still discover every skill from the repo root, and skip none of them.
      - name: Discovery smoke test
        run: |
          set -euo pipefail
          expected=$(find skills -name SKILL.md | wc -l)
          out=$(npx -y skills add . -l 2>&1 | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g')
          echo "$out"
          if grep -q 'Skipped' <<<"$out"; then
            echo "::error::the skills CLI skipped at least one skill"
            exit 1
          fi
          if ! grep -q "Found $expected skills" <<<"$out"; then
            echo "::error::expected $expected skills, CLI reported otherwise"
            exit 1
          fi

      # The MCP renderer's failure mode is silent: a config that parses but carries
      # the literal string `${TOKEN}` as a credential. Render into a throwaway HOME
      # with every agent "installed", then assert each file parses and that no
      # placeholder survived into a target that cannot expand it.
      - name: MCP render
        run: |
          set -euo pipefail
          fake=$(mktemp -d)
          mkdir -p "$fake"/{.claude-perso,.claude-work,.codex,.cursor,.gemini} \
                   "$fake"/.config/{opencode,Code/User}
          env -u CLAUDE_CONFIG_DIR HOME="$fake" node scripts/install-mcp.mjs
          python3 - "$fake" <<'PY'
          import json, re, sys, tomllib, pathlib
          home = pathlib.Path(sys.argv[1])
          tomllib.loads((home / '.codex/config.toml').read_text())

          # One exact pattern per agent, not a substring test. `ok in value` was
          # vacuous for gemini-cli ('$' is implied by every dialect) and could not
          # tell claude-code's ${NAME} from Cursor's ${env:NAME} — so the one
          # regression this step exists to catch, an adapter given the wrong
          # dialect, passed. Anything matching ANY dialect must match THIS one.
          DIALECTS = {
              'claude-code': re.compile(r'\$\{(?!env:)[A-Za-z_][A-Za-z0-9_]*\}'),
              'opencode':    re.compile(r'\{env:[A-Za-z_][A-Za-z0-9_]*\}'),
              'vscode':      re.compile(r'\$\{env:[A-Za-z_][A-Za-z0-9_]*\}'),
              'cursor':      re.compile(r'\$\{env:[A-Za-z_][A-Za-z0-9_]*\}'),
              'gemini-cli':  re.compile(r'\$[A-Za-z_][A-Za-z0-9_]*$'),
          }
          # A value holding a credential must reference it, never carry it: if none
          # of the known forms appears at all, the renderer materialised a secret.
          ANY = re.compile(r'\$\{[^}]*\}|\{env:[^}]*\}|\$[A-Za-z_][A-Za-z0-9_]*')
          SECRETISH = re.compile(r'key|token|secret|password|session|client[-_]?id|auth', re.I)

          for rel, key, agent in [
              ('.claude-perso/.claude.json', 'mcpServers', 'claude-code'),
              ('.config/opencode/opencode.json', 'mcp', 'opencode'),
              ('.config/Code/User/mcp.json', 'servers', 'vscode'),
              ('.cursor/mcp.json', 'mcpServers', 'cursor'),
              ('.gemini/settings.json', 'mcpServers', 'gemini-cli'),
          ]:
              want = DIALECTS[agent]
              servers = json.loads((home / rel).read_text())[key]
              assert servers, f'{rel}: no servers written'
              seen = 0
              for name, s in servers.items():
                  for slot in ('headers', 'env', 'environment'):
                      for k, v in (s.get(slot) or {}).items():
                          v = str(v)
                          if ANY.search(v):
                              assert want.search(v), f'{rel}/{name}/{slot}.{k}: not {agent} dialect: {v!r}'
                              seen += 1
                          elif SECRETISH.search(k):
                              raise AssertionError(f'{rel}/{name}/{slot}.{k}: literal credential, no reference')
              assert seen, f'{rel}: no {agent} placeholder found at all — dialect untested'
          print('MCP render OK')
          PY

          # Disabling a server must also uninstall it. That path runs off the lock
          # file rather than off the manifest, so nothing about the first render
          # exercises it — and its failure is invisible until a parked server is
          # still answering somewhere weeks later.
          python3 -c "
          import json
          m = json.load(open('mcp/servers.json'))
          name = next(iter(m['servers']))
          m['servers'][name]['enabled'] = False
          m['servers'][name]['note'] = 'parked by CI to exercise the removal path'
          json.dump({'name': name, **m}, open('/tmp/off.json', 'w'))
          "
          off=$(python3 -c "import json; print(json.load(open('/tmp/off.json'))['name'])")
          env -u CLAUDE_CONFIG_DIR HOME="$fake" node scripts/install-mcp.mjs --manifest /tmp/off.json
          python3 - "$fake" "$off" <<'PY'
          import json, sys, pathlib
          home, off = pathlib.Path(sys.argv[1]), sys.argv[2]
          for rel, key in [('.claude-perso/.claude.json', 'mcpServers'),
                           ('.config/opencode/opencode.json', 'mcp'),
                           ('.config/Code/User/mcp.json', 'servers')]:
              servers = json.loads((home / rel).read_text())[key]
              assert off not in servers, f'{rel}: disabled server {off} was not removed'
              assert servers, f'{rel}: everything was removed, not just {off}'
          assert off not in json.loads((home / '.agents/.mcp-lock.json').read_text())['targets']['claude-code:perso']['servers']
          print(f'MCP disable OK ({off} removed)')
          PY

      # Proves the portability claim rather than asserting it: the whole catalog
      # must install for agents that are not Claude Code.
      - name: Portability install
        run: |
          set -euo pipefail
          expected=$(find skills -name SKILL.md | wc -l)
          work=$(mktemp -d)
          git -C "$work" init -q .
          out=$(cd "$work" && npx -y skills add "$GITHUB_WORKSPACE" \
                  -a codex -a cursor -a opencode -a gemini-cli -s '*' -y 2>&1 \
                | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g')
          echo "$out"
          if ! grep -q "Installed $expected skills" <<<"$out"; then
            echo "::error::not every skill installed for the non-Claude targets"
            exit 1
          fi
